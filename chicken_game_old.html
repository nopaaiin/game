<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치킨 조리 게임</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#111; font-family:sans-serif; }
  #wrap { position:relative; width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; }
  #stage {
    position:relative; height:100vh; aspect-ratio:9/16; max-width:100vw;
    background:linear-gradient(#fdf6ec, #f7e9d0);
    overflow:hidden; box-shadow:0 0 40px rgba(0,0,0,.5);
  }
  #cam {
    position:absolute; top:10px; right:10px; width:120px; border-radius:10px;
    transform:scaleX(-1); opacity:.85; z-index:20; border:2px solid #fff;
  }
  #world { position:absolute; inset:0; z-index:5; }
  #overlay { position:absolute; inset:0; z-index:6; pointer-events:none; }
  #ui { position:absolute; top:10px; left:12px; z-index:30; color:#fff; font-weight:800;
        text-shadow:0 1px 4px rgba(0,0,0,.7), 0 0 2px rgba(0,0,0,.9); }
  #stageLabel { font-size:14px; opacity:.7; }
  #score { font-size:26px; }
  #sub { font-size:13px; opacity:.7; max-width:60vw; }
  #cursorImg {
    position:absolute; z-index:15; width:170px; pointer-events:none;
    transform:translate(-50%, -50%); display:none;
  }
  #handDot {
    position:absolute; z-index:16; width:26px; height:26px; margin:-13px;
    border-radius:50%; background:rgba(231,76,60,.5); border:2px solid #fff;
    pointer-events:none; display:none;
  }
  #msg {
    position:absolute; inset:0; z-index:40; display:flex; flex-direction:column;
    justify-content:center; align-items:center; background:rgba(255,255,255,.88);
    color:#5a3a1a; text-align:center; padding:24px;
  }
  #msg h1 { font-size:26px; margin-bottom:14px; }
  #msg p { font-size:14px; line-height:1.7; margin-bottom:6px; }
  #startBtn {
    margin-top:18px; padding:12px 30px; font-size:16px; font-weight:800;
    background:#e74c3c; color:#fff; border:none; border-radius:30px; cursor:pointer;
  }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="world"></canvas>
    <canvas id="overlay"></canvas>
    <img id="cursorImg" src="g.png" alt="그릇">
    <div id="handDot"></div>
    <video id="cam" autoplay playsinline muted></video>
    <div id="ui">
      <div id="stageLabel">스테이지 1 · 담기</div>
      <div id="score">0</div>
      <div id="sub"></div>
    </div>
    <div id="msg">
      <h1>치킨 조리 게임</h1>
      <p>손을 웹캠에 비추면 조작할 수 있어요.</p>
      <p>1단계 담기 → 2단계 썰기 → 3단계 굽기</p>
      <p style="opacity:.55">각 단계 목표를 채우면 자동으로 넘어가요</p>
      <button id="startBtn">시작하기</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
const { Engine, Runner, World, Bodies, Body, Events } = Matter;

const stage = document.getElementById('stage');
const canvas = document.getElementById('world');
const overlay = document.getElementById('overlay');
const cursorImg = document.getElementById('cursorImg');
const handDot = document.getElementById('handDot');
const stageLabel = document.getElementById('stageLabel');
const scoreEl = document.getElementById('score');
const subEl = document.getElementById('sub');
const msg = document.getElementById('msg');
const startBtn = document.getElementById('startBtn');
const cam = document.getElementById('cam');

let W = 0, H = 0;

function resize() {
  W = stage.clientWidth; H = stage.clientHeight;
  canvas.width = W; canvas.height = H;
  overlay.width = W; overlay.height = H;
}
resize();
window.addEventListener('resize', resize);

const ctx = canvas.getContext('2d');
const octx = overlay.getContext('2d');

// ===== 이미지 로드 =====
const imgs = {};
function loadImg(name, src) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => { imgs[name] = im; res(); };
    im.onerror = () => { imgs[name] = null; res(); };
    im.src = src;
  });
}

// ===== 손 추적 상태 =====
let handX = W/2, handY = H*0.7;
let prevHX = handX, prevHY = handY;
let handSpeed = 0;
let handVisible = false;

function onResults(results) {
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    handVisible = true;
    const lm = results.multiHandLandmarks[0];
    // 검지끝(8) 위주로 잡으면 칼끝처럼 정밀해짐
    const cx = lm[8].x*0.6 + lm[9].x*0.4;
    const cy = lm[8].y*0.6 + lm[9].y*0.4;
    handX = (1 - cx) * W;
    handY = cy * H;
  } else {
    handVisible = false;
  }
}

const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
hands.setOptions({ maxNumHands:1, modelComplexity:0, minDetectionConfidence:0.6, minTrackingConfidence:0.6 });
hands.onResults(onResults);
const camera = new Camera(cam, { onFrame: async () => { await hands.send({ image: cam }); }, width:320, height:240 });
camera.start();

let sx = W/2, sy = H*0.7;
function smoothHand() {
  sx += (handX - sx) * 0.35;
  sy += (handY - sy) * 0.35;
  handSpeed = Math.hypot(handX - prevHX, handY - prevHY);
  prevHX = handX; prevHY = handY;
  requestAnimationFrame(smoothHand);
}
smoothHand();

// ===== 공용 물리엔진 =====
let engine, world;
function newEngine(gravity) {
  if (engine) { World.clear(world, false); Engine.clear(engine); }
  engine = Engine.create();
  engine.gravity.y = gravity;
  world = engine.world;
}

// ===== 스테이지 매니저 =====
let current = null;
let runner = null;

function setStage(st) {
  if (current && current.cleanup) current.cleanup();
  current = st;
  cursorImg.style.display = 'none';
  handDot.style.display = 'none';
  octx.clearRect(0,0,W,H);
  st.init();
}

function loop() {
  ctx.clearRect(0,0,W,H);
  octx.clearRect(0,0,W,H);
  if (current && current.update) current.update();
  if (current && current.draw) current.draw();
  requestAnimationFrame(loop);
}
loop();

// 공용: 아이템 그리기 (이미지 없으면 색 도형)
const COLORS = { chicken:'#d9822b', ricecake:'#e74c3c', green:'#8bc34a' };
function drawFood(c, key, size){
  const im=imgs[key];
  if(im) c.drawImage(im,-size/2,-size/2,size,size);
  else { c.fillStyle=COLORS[key]||'#999'; c.beginPath(); c.arc(0,0,size/2.4,0,7); c.fill(); }
}

// 공용: 배경 이미지를 화면에 꽉 차게(cover) + 반투명 막으로 톤다운
// veil: 위에 씌우는 막 색/투명도 (오브젝트 잘 보이게)
function drawBackground(key, veil){
  const im = imgs[key];
  if(im){
    // cover 계산
    const ir = im.width/im.height, sr = W/H;
    let dw, dh, dx, dy;
    if(ir > sr){ dh=H; dw=H*ir; dx=(W-dw)/2; dy=0; }
    else { dw=W; dh=W/ir; dx=0; dy=(H-dh)/2; }
    ctx.drawImage(im, dx, dy, dw, dh);
  } else {
    ctx.fillStyle = '#f7e9d0'; ctx.fillRect(0,0,W,H);
  }
  // 톤다운 막
  ctx.fillStyle = veil || 'rgba(255,255,255,0.45)';
  ctx.fillRect(0,0,W,H);
}

// =========================================================
// 스테이지 1: 담기 (치킨/떡/파 골고루)  - 재설계
// =========================================================
const Stage1 = (() => {
  let floor, wallL, wallR, foods = [], dropTimer = null;
  let score = 0;
  const GOAL = 80;
  // ===== 그릇 튜닝 값 =====
  const BOWL_W = 230;          // 그릇 폭(안쪽)
  const WALL_H = 95;           // 벽 높이
  const BOWL_Y = 0.62;         // 그릇 바닥선 세로 위치
  const CURSOR_W = 260;        // 그릇 이미지 폭
  const FOOD_R = 46;           // 그림 반지름
  const PHYS_RATIO = 0.82;     // 물리/그림 비

  let bowlCX = W/2;
  const bowlCYv = () => H*BOWL_Y;

  // 상자형 그릇: 넓은 바닥 + 양쪽 높은 벽 (튕김 없이 확실히 담김)
  function buildBowl() {
    const opts = { isStatic:true, label:'bowl', friction:0.9, restitution:0, frictionStatic:1 };
    const cy = bowlCYv();
    floor = Bodies.rectangle(bowlCX, cy, BOWL_W, 18, opts);
    wallL = Bodies.rectangle(bowlCX-BOWL_W/2, cy-WALL_H/2, 16, WALL_H, opts);
    wallR = Bodies.rectangle(bowlCX+BOWL_W/2, cy-WALL_H/2, 16, WALL_H, opts);
    World.add(world, [floor, wallL, wallR]);
  }
  function moveBowl(x){
    x = Math.max(BOWL_W/2+10, Math.min(W-BOWL_W/2-10, x));
    const prev = bowlCX;
    bowlCX = prev + (x - prev)*0.35;
    const ddx = bowlCX - prev;
    const cy = bowlCYv();
    Body.setPosition(floor, {x:bowlCX, y:cy});
    Body.setPosition(wallL, {x:bowlCX-BOWL_W/2, y:cy-WALL_H/2});
    Body.setPosition(wallR, {x:bowlCX+BOWL_W/2, y:cy-WALL_H/2});
    // 그릇 안 재료도 살짝 따라오게
    for(const f of foods){
      if(f.inBowl){ Body.translate(f, {x:ddx*0.6, y:0}); }
    }
  }

  const KEYS=['chicken','ricecake','green'];
  let bag=[];
  function nextKey(){ if(bag.length===0) bag=[...KEYS].sort(()=>Math.random()-0.5); return bag.pop(); }
  function spawn(){
    const key=nextKey();
    const drawR = FOOD_R * (key==='green'?0.95:1);
    const physR = drawR * PHYS_RATIO;
    // 그릇 x 근처로 떨어뜨려 받기 쉽게
    const x = bowlCX + (Math.random()-0.5)*BOWL_W*0.7;
    const b=Bodies.circle(Math.max(40,Math.min(W-40,x)), -40, physR,
      {restitution:0.02, friction:0.9, frictionStatic:1, density:0.001, label:'food'});
    b.key=key; b.r=drawR; b.inBowl=false; b.counted=false;
    foods.push(b); World.add(world,b);
  }

  return {
    init(){
      newEngine(0.6);
      if(runner) Runner.stop(runner);
      runner = Runner.create(); Runner.run(runner, engine);
      score=0; foods=[]; bag=[]; bowlCX=W/2;
      World.add(world, [
        Bodies.rectangle(W/2, H+40, W, 80, {isStatic:true, label:'ground'}),
        Bodies.rectangle(-30, H/2, 60, H*2, {isStatic:true}),
        Bodies.rectangle(W+30, H/2, 60, H*2, {isStatic:true})
      ]);
      buildBowl();
      cursorImg.style.display='none';
      stageLabel.textContent='스테이지 1 · 담기';
      scoreEl.textContent='0';
      subEl.textContent='손을 좌우로 움직여 그릇으로 받기 (목표 '+GOAL+'점)';
      dropTimer=setInterval(spawn, 1400);
    },
    update(){
      moveBowl(sx);
      const cy = bowlCYv();
      for(const f of foods){
        // 그릇 폭 안 + 바닥 위(벽 안쪽) + 느림 = 담김. 물리는 계속 -> 쌓임
        const inX = Math.abs(f.position.x - bowlCX) < BOWL_W/2 - 2;
        const aboveFloor = f.position.y < cy && f.position.y > cy - WALL_H - 80;
        const slow = Math.hypot(f.velocity.x, f.velocity.y) < 2;
        if(inX && aboveFloor && slow){
          f.inBowl = true;
          if(!f.counted){
            f.counted = true; score += 10; scoreEl.textContent = score;
            if(score>=GOAL){ setTimeout(()=>setStage(Stage2),700); }
          }
        } else if(!inX || f.position.y > cy + 20){
          f.inBowl = false;
        }
      }
      // 그릇 밖으로 떨어지거나 폭발한 재료 제거 + 점수 회수
      foods = foods.filter(f=>{
        const spd = Math.hypot(f.velocity.x, f.velocity.y);
        if(f.position.y > H+60 || f.position.y < -250 || spd > 45){
          if(f.counted){ score=Math.max(0,score-10); scoreEl.textContent=score; }
          World.remove(world,f); return false;
        }
        return true;
      });
    },
    draw(){
      drawBackground('bg1', 'rgba(20,20,30,0.28)');
      const cx=bowlCX, cy=bowlCYv();
      const bim = imgs['bowl'];
      
      if(bim){
        const bw=CURSOR_W, bh=bw*(bim.height/bim.width);
        const bowlTop = cy - bh*0.62;
        
        // 1단계: 그릇의 입구까지 부분만 그리기 (상단 62%)
        // drawImage(image, sx, sy, sw, sh, dx, dy, dw, dh)
        // 원본 이미지의 상단 62%만 캔버스 상단에 그리기
        ctx.drawImage(
          bim,
          0, 0, bim.width, bim.height * 0.62,
          cx - bw/2, bowlTop, bw, bh * 0.62
        );
      }
      
      // 2단계: 모든 재료 그리기
      for(const f of foods){
        ctx.save(); ctx.translate(f.position.x,f.position.y); ctx.rotate(f.angle);
        drawFood(ctx, f.key, f.r*2.4);
        ctx.restore();
      }
      
      // 3단계: 그릇의 앞 테두리 부분만 그리기 (하단 38%)
      if(bim){
        const bw=CURSOR_W, bh=bw*(bim.height/bim.width);
        const bowlTop = cy - bh*0.62;
        const rimRatio = 0.38;
        
        // 원본 이미지의 하단 38% 부분만 캔버스 하단에 그리기
        ctx.drawImage(
          bim,
          0, bim.height * 0.62, bim.width, bim.height * 0.38,
          cx - bw/2, bowlTop + bh * 0.62, bw, bh * 0.38
        );
      }
      
      // 디버그(D): 물리 상자 표시
      if(window.DEBUG_BOWL){
        ctx.strokeStyle='rgba(0,200,0,.9)'; ctx.lineWidth=2;
        for(const seg of [floor,wallL,wallR]){
          const w=seg.bounds.max.x-seg.bounds.min.x, h=seg.bounds.max.y-seg.bounds.min.y;
          ctx.strokeRect(seg.position.x-w/2, seg.position.y-h/2, w, h);
        }
      }
    },
    cleanup(){ clearInterval(dropTimer); }
  };
})();

// =========================================================
// 스테이지 2: 썰기 (프룻닌자식 + 이펙트)
// =========================================================
const Stage2 = (() => {
  const GOAL = 12;
  let cut = 0;
  let objs = [];
  let halves = [];
  let particles = [];      // 즙/파편 파티클
  let flashes = [];        // 벨 때 섬광
  let popups = [];         // 콤보/점수 팝업
  let spawnTimer = null;
  const GRAV = 0.35;
  const SLASH_SPEED = 9;
  let trail = [];
  let combo = 0, comboTimer = 0;
  let shake = 0;           // 화면 흔들림
  const KEYS=['chicken','ricecake','green'];
  let bag=[];
  function nextKey(){ if(bag.length===0) bag=[...KEYS].sort(()=>Math.random()-0.5); return bag.pop(); }

  function toss(){
    const key=nextKey();
    const x = W*0.22 + Math.random()*W*0.56;
    objs.push({
      x, y:H+50, vx:(W/2-x)/60 + (Math.random()-0.5)*2,
      vy: -(15.5+Math.random()*3),
      rot:0, vr:(Math.random()-0.5)*0.2,
      r:56, key, sliced:false
    });
  }
  function makeHalf(o, dir){
    halves.push({
      x:o.x, y:o.y, vx:o.vx+dir*4, vy:o.vy-2,
      rot:o.rot, vr:dir*0.22, r:o.r, key:o.key, side:dir, life:70
    });
  }
  // 벨 이펙트: 파티클 터짐 + 섬광 + 팝업
  function sliceFX(o){
    const col = COLORS[o.key] || '#fff';
    // 즙 파티클 (재료 색)
    const n = 16 + Math.floor(Math.random()*8);
    for(let i=0;i<n;i++){
      const ang = Math.random()*Math.PI*2;
      const sp = 3 + Math.random()*8;
      particles.push({
        x:o.x, y:o.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 2,
        r: 3+Math.random()*5, col, life: 30+Math.random()*20, maxlife:50
      });
    }
    // 하얀 반짝이 몇 개
    for(let i=0;i<6;i++){
      const ang=Math.random()*Math.PI*2, sp=4+Math.random()*6;
      particles.push({x:o.x,y:o.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:2+Math.random()*2,col:'#fff',life:20,maxlife:20});
    }
    flashes.push({x:o.x, y:o.y, r:o.r*0.6, life:10, maxlife:10});
    shake = Math.min(14, shake+6);
    // 콤보
    combo++; comboTimer = 45;
    const pts = combo>=3 ? combo*10 : 10;
    popups.push({x:o.x, y:o.y-20, text: combo>=3 ? (combo+' COMBO! +'+pts) : '+10',
                 life:40, maxlife:40, big: combo>=3});
  }

  return {
    init(){
      cut=0; objs=[]; halves=[]; particles=[]; flashes=[]; popups=[]; trail=[];
      combo=0; comboTimer=0; shake=0;
      handDot.style.display='block';
      stageLabel.textContent='스테이지 2 · 썰기';
      scoreEl.textContent='0';
      subEl.textContent='날아오는 재료를 손으로 슥 베세요 (목표 '+GOAL+')';
      spawnTimer=setInterval(()=>{ toss(); if(Math.random()<0.4) setTimeout(toss,280); }, 1050);
    },
    update(){
      handDot.style.left=sx+'px'; handDot.style.top=sy+'px';
      const slashing = handSpeed>SLASH_SPEED;
      handDot.style.background = slashing ? 'rgba(46,204,113,.95)' : 'rgba(231,76,60,.4)';
      trail.push({x:sx,y:sy, fast:slashing}); if(trail.length>14) trail.shift();

      // 콤보 타이머
      if(comboTimer>0){ comboTimer--; if(comboTimer===0) combo=0; }
      if(shake>0) shake*=0.85;

      for(const o of objs){
        o.x+=o.vx; o.y+=o.vy; o.vy+=GRAV; o.rot+=o.vr;
        if(!o.sliced && slashing){
          const d=Math.hypot(sx-o.x, sy-o.y);
          if(d < o.r+26){
            o.sliced=true; cut++; scoreEl.textContent=cut;
            makeHalf(o,-1); makeHalf(o,1);
            sliceFX(o);
            if(cut>=GOAL){ clearInterval(spawnTimer); setTimeout(()=>setStage(Stage3),800); }
          }
        }
      }
      objs = objs.filter(o=> !o.sliced && o.y<=H+70);

      for(const h of halves){ h.x+=h.vx; h.y+=h.vy; h.vy+=GRAV; h.rot+=h.vr; h.life--; }
      halves = halves.filter(h=>h.y<H+90 && h.life>0);

      for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.25; p.vx*=0.98; p.life--; }
      particles = particles.filter(p=>p.life>0);

      for(const f of flashes){ f.life--; f.r+=6; }
      flashes = flashes.filter(f=>f.life>0);

      for(const pu of popups){ pu.y-=1.2; pu.life--; }
      popups = popups.filter(pu=>pu.life>0);
    },
    draw(){
      // 화면 흔들림
      const shx=(Math.random()-0.5)*shake, shy=(Math.random()-0.5)*shake;
      ctx.save(); octx.save();
      ctx.translate(shx,shy); octx.translate(shx,shy);

      drawBackground('bg2', 'rgba(250,245,235,0.5)');

      // 통짜 재료
      for(const o of objs){
        ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(o.rot);
        drawFood(ctx, o.key, o.r*2);
        ctx.restore();
      }
      // 잘린 반쪽 (벌어지며 날아감)
      for(const h of halves){
        const im=imgs[h.key], s=h.r*2;
        ctx.save(); ctx.translate(h.x,h.y); ctx.rotate(h.rot);
        ctx.globalAlpha = Math.max(0, h.life/70);
        if(im){
          if(h.side<0) ctx.drawImage(im,0,0,im.width/2,im.height,-s/2,-s/2,s/2,s);
          else ctx.drawImage(im,im.width/2,0,im.width/2,im.height,0,-s/2,s/2,s);
        } else {
          ctx.fillStyle=COLORS[h.key]||'#999';
          if(h.side<0) ctx.fillRect(-s/2,-s/2,s/2,s); else ctx.fillRect(0,-s/2,s/2,s);
        }
        ctx.restore();
      }
      // 즙 파티클
      for(const p of particles){
        ctx.globalAlpha = Math.max(0, p.life/p.maxlife);
        ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
      }
      ctx.globalAlpha=1;
      // 섬광
      for(const f of flashes){
        const a = f.life/f.maxlife;
        const g = ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
        g.addColorStop(0,'rgba(255,255,255,'+(a*0.9)+')');
        g.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill();
      }
      // 콤보/점수 팝업
      for(const pu of popups){
        ctx.globalAlpha = Math.max(0, pu.life/pu.maxlife);
        ctx.fillStyle = pu.big ? '#ff5252' : '#fff';
        ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.lineWidth=3;
        ctx.font = 'bold '+(pu.big?30:20)+'px sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.strokeText(pu.text, pu.x, pu.y); ctx.fillText(pu.text, pu.x, pu.y);
      }
      ctx.globalAlpha=1;

      // 빛나는 칼날 궤적
      if(trail.length>1){
        octx.lineCap='round'; octx.lineJoin='round';
        // 바깥 글로우
        for(let i=1;i<trail.length;i++){
          const a=trail[i-1], b=trail[i];
          if(!b.fast) continue;
          const t=i/trail.length;
          octx.strokeStyle='rgba(120,220,255,'+(0.35*t)+')';
          octx.lineWidth = 18*t+4;
          octx.beginPath(); octx.moveTo(a.x,a.y); octx.lineTo(b.x,b.y); octx.stroke();
        }
        // 안쪽 흰 심지
        for(let i=1;i<trail.length;i++){
          const a=trail[i-1], b=trail[i];
          const t=i/trail.length;
          octx.strokeStyle = b.fast ? 'rgba(255,255,255,'+(0.95*t)+')' : 'rgba(255,255,255,'+(0.15*t)+')';
          octx.lineWidth = b.fast ? 6*t+2 : 2;
          octx.beginPath(); octx.moveTo(a.x,a.y); octx.lineTo(b.x,b.y); octx.stroke();
        }
      }
      ctx.restore(); octx.restore();

      // 콤보 카운터 (고정 위치, 흔들림 밖)
      if(combo>=2){
        octx.save();
        octx.fillStyle='#ff5252'; octx.font='bold 26px sans-serif';
        octx.textAlign='center'; octx.textBaseline='top';
        octx.strokeStyle='rgba(0,0,0,.5)'; octx.lineWidth=3;
        const tx=W/2, ty=60;
        octx.strokeText(combo+' COMBO', tx, ty);
        octx.fillText(combo+' COMBO', tx, ty);
        octx.restore();
      }
    },
    cleanup(){ clearInterval(spawnTimer); }
  };
})();

// =========================================================
// 스테이지 3: 굽기 (다이얼식 - 손으로 노브를 돌림)
// =========================================================
const Stage3 = (() => {
  const TARGET = 195, MAXT = 250, TOL = 10;
  let temp = 20, holdTime = 0;
  let knobAngle = 0;
  const R = 100;
  const cx=()=>W/2, cy=()=>H*0.5;
  const A_START=Math.PI*0.75, A_END=Math.PI*2.25;

  return {
    init(){
      temp=20; holdTime=0; knobAngle=A_START;
      handDot.style.display='block';
      stageLabel.textContent='스테이지 3 · 굽기';
      scoreEl.textContent='20°';
      subEl.textContent='손을 좌우로 움직여 노브를 돌리세요 → '+TARGET+'°';
    },
    update(){
      handDot.style.left=sx+'px'; handDot.style.top=sy+'px';
      // 손 x 위치(화면 좌우)를 그대로 온도에 매핑. 좌:저온 우:고온
      const margin = W*0.12;
      let ratio = (sx - margin) / (W - margin*2);
      ratio = Math.max(0, Math.min(1, ratio));
      const targetTemp = ratio * MAXT;
      // 부드럽게 추종
      temp += (targetTemp - temp) * 0.2;
      const shown = Math.round(temp);
      scoreEl.textContent = shown+'°';
      // 노브 각도도 온도 따라
      knobAngle = A_START + (temp/MAXT)*(A_END-A_START);
      handDot.style.background = Math.abs(temp-TARGET)<=TOL ? 'rgba(46,204,113,.9)':'rgba(231,76,60,.6)';

      if(Math.abs(temp-TARGET)<=TOL){
        holdTime++; subEl.textContent='딱 맞아요! 유지... '+Math.min(100,Math.round(holdTime/1.2))+'%';
        if(holdTime>120){ subEl.textContent='완성!'; setTimeout(()=>setStage(Done),400); }
      } else {
        holdTime=Math.max(0,holdTime-3);
        subEl.textContent = temp<TARGET ? '오른쪽으로 → 더 뜨겁게' : '← 왼쪽으로 식히기';
      }
    },
    draw(){
      // 배경 (오븐 내부). 어두운 이미지라 살짝만 눌러 노브 대비 확보
      drawBackground('bg3', 'rgba(20,10,0,0.35)');
      const x=cx(), y=cy();
      ctx.save();
      ctx.lineWidth=12; ctx.strokeStyle='#ccc';
      ctx.beginPath(); ctx.arc(x,y,R+24,A_START,A_END); ctx.stroke();
      const tA=A_START+(TARGET/MAXT)*(A_END-A_START);
      ctx.strokeStyle='#2ecc71'; ctx.lineWidth=18;
      ctx.beginPath(); ctx.arc(x,y,R+24,tA-0.16,tA+0.16); ctx.stroke();
      ctx.strokeStyle=Math.abs(temp-TARGET)<=TOL?'#2ecc71':'#e67e22'; ctx.lineWidth=12;
      ctx.beginPath(); ctx.arc(x,y,R+24,A_START,knobAngle); ctx.stroke();
      ctx.fillStyle='#2b2b2b'; ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.fill();
      ctx.fillStyle='#3d3d3d'; ctx.beginPath(); ctx.arc(x,y,R-12,0,7); ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=9; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x,y);
      ctx.lineTo(x+Math.cos(knobAngle)*(R-20), y+Math.sin(knobAngle)*(R-20)); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font='bold 34px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(Math.round(temp)+'°', x, y);
      const im=imgs['chicken'];
      if(im) ctx.drawImage(im,x-38,y+R+38,76,76);
      ctx.restore();
    },
    cleanup(){}
  };
})();

// =========================================================
// 완료
// =========================================================
const Done = {
  init(){
    cursorImg.style.display='none'; handDot.style.display='none';
    if(runner) Runner.stop(runner);
    msg.classList.remove('hidden');
    msg.querySelector('h1').textContent='치킨 완성!';
    msg.querySelector('p').textContent='담기 → 썰기 → 굽기 모두 클리어!';
    startBtn.textContent='처음부터';
  },
  update(){}, draw(){}, cleanup(){}
};

// ===== 시작 =====
startBtn.addEventListener('click', ()=>{
  msg.classList.add('hidden');
  setStage(Stage1);
});
